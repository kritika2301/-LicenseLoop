
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}LicenseLoop{% endblock %}</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <div class="app-container">

        <!-- Sidebar -->
        <aside class="sidebar">

            <!-- Clickable Brand Logo -->
            <a href="{{ url_for('main.dashboard') }}"
               class="brand text-decoration-none">

                <i class="bi bi-infinity"></i>
                <span>LicenseLoop</span>

            </a>

            <div class="sidebar-menu">

                <p class="menu-heading">MAIN MENU</p>

                <!-- Dashboard -->
                <a href="{{ url_for('main.dashboard') }}"
                   class="nav-link {% if request.endpoint == 'main.dashboard' %}active{% endif %}">

                    <i class="bi bi-grid"></i>
                    <span>Dashboard</span>

                </a>

                <!-- Software -->
                <a href="{{ url_for('main.software_list') }}"
                   class="nav-link {% if request.endpoint in ['main.software_list', 'main.edit_software'] %}active{% endif %}">

                    <i class="bi bi-pc-display"></i>
                    <span>Software</span>

                </a>

                <!-- Vendors -->
                <a href="{{ url_for('main.vendors_list') }}"
                   class="nav-link {% if request.endpoint in ['main.vendors_list', 'main.edit_vendor'] %}active{% endif %}">

                    <i class="bi bi-buildings"></i>
                    <span>Vendors</span>

                </a>

                <!-- Licenses -->
                <a href="{{ url_for('main.licenses_list') }}"
                   class="nav-link {% if request.endpoint in ['main.licenses_list', 'main.edit_license'] %}active{% endif %}">

                    <i class="bi bi-key"></i>
                    <span>Licenses</span>

                </a>

                <!-- Renewals -->
                <a href="{{ url_for('main.renewals') }}"
                   class="nav-link {% if request.endpoint in ['main.renewals', 'main.update_renewal_status'] %}active{% endif %}">

                    <i class="bi bi-arrow-repeat"></i>
                    <span>Renewals</span>

                </a>

                <!-- Reports -->
                <a href="{{ url_for('main.reports') }}"
                   class="nav-link {% if request.endpoint == 'main.reports' %}active{% endif %}">

                    <i class="bi bi-bar-chart"></i>
                    <span>Reports</span>

                </a>

            </div>

            <!-- Sidebar Footer -->
            <div class="sidebar-footer">

                <i class="bi bi-shield-check"></i>
                <span>LicenseLoop Management</span>

            </div>

        </aside>


        <!-- Main Content -->
        <main class="main-content">

            <!-- Top Header -->
            <header class="topbar">

                <div>
                    <h6>Software License Management</h6>
                    <small>Manage your software resources efficiently</small>
                </div>

                <div class="profile">

                    <i class="bi bi-bell"></i>

                    <div class="profile-avatar">A</div>

                    <span>Admin</span>

                </div>

            </header>


            <!-- Page Content -->
            <section class="page-content">

                {% block content %}
                {% endblock %}

            </section>

        </main>

    </div>


    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <!-- Custom JavaScript -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>

</body>
</html>
